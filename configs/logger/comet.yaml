# https://www.comet.ml
# original refer to: https://github.com/ashleve/lightning-hydra-template/blob/main/configs/logger/comet.yaml
# modify refer to: https://github.com/nathanpainchaud/lightning-hydra-template/blob/main/src/lightning_hydra_template/configs/logger/comet.yaml
# modify project_name

comet:
  _target_: lightning.pytorch.loggers.comet.CometLogger
  api_key: ${oc.env:COMET_API_TOKEN} # api key is loaded from environment variable
  save_dir: "${paths.output_dir}"
  # project_name: "lightning-hydra-template" 
  project_name: ${call:os.path.basename,${oc.env:PROJECT_ROOT}}
  rest_api_key: null
  # experiment_name: ""
  experiment_key: null # set to resume experiment
  offline: False
  prefix: ""
